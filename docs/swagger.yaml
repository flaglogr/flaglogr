basePath: /
definitions:
  model.APIKey:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  model.CreateProjectRequest:
    properties:
      name:
        example: name
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  model.Project:
    properties:
      apiKeys:
        items:
          $ref: '#/definitions/model.APIKey'
        type: array
      name:
        type: string
      updatedAt:
        type: string
    required:
    - apiKeys
    - name
    - updatedAt
    type: object
  model.UpdateProjectRequest:
    properties:
      groupId:
        example: 1
        type: integer
      name:
        example: name
        maxLength: 250
        minLength: 3
        type: string
    type: object
info:
  contact:
    email: support@janishutz.com
    name: Support
    url: https://github.com/flaglogr/flaglogr#readme
  description: |
    Log in via [here](/auth/v2/login)
  license:
    name: GNU Affero General Public License 3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  termsOfService: https://janishutz.com/legal/tos/
  title: flaglogr backend
  version: 0.1.0
paths:
  /api/v1/projects/create:
    put:
      consumes:
      - application/json
      description: Create a new project for a given group
      parameters:
      - description: The project to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Create a new project
      tags:
      - projects
  /api/v1/projects/delete/{id}:
    delete:
      description: Deletes the specified project permanently, no questions asked,
        including all flags, evaluations and results
      parameters:
      - description: The project ID as supplied by the get endpoint
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User was not found
        "500":
          description: Internal Server Error
      summary: Delete given project
      tags:
      - projects
  /api/v1/projects/get:
    get:
      description: Retrieve a list of all projects of all groups of the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Project'
            type: array
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: get all projects
      tags:
      - projects
  /api/v1/projects/update/{id}:
    patch:
      consumes:
      - application/json
      description: Update the specified project
      parameters:
      - description: Details to update for the project
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Project updated successfully
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Update a project
      tags:
      - projects
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Asset CRUD (assets are any type of file the user can upload)
  name: projects
